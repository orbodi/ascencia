services:
  db:
    image: postgres:16-alpine
    container_name: geminia-db
    environment:
      POSTGRES_USER: geminia
      POSTGRES_PASSWORD: geminia
      POSTGRES_DB: geminia
    ports:
      - "5432:5432"
    volumes:
      - geminia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geminia -d geminia"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: geminia-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://geminia:geminia@db:5432/geminia
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    container_name: geminia-frontend
    working_dir: /fe
    volumes:
      - ./frontend:/fe
    ports:
      - "5173:5173"
    environment:
      VITE_API_TOKEN: change-me
      VITE_PROXY_TARGET: http://app:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - app
    profiles:
      - dev

volumes:
  geminia_pgdata:
